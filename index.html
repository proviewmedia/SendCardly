<style>
:root {
  --bg: #f7f6f3;
  --panel: #ffffff;
  --area: #edece8;
  --border: #e2e0db;
  --borderLight: #eeedea;
  --text: #1a1a1a;
  --text2: #666360;
  --text3: #9e9a95;
  --text4: #c8c4be;
  --accent: #1a1a1a;
  --accentLight: #f0efed;
  --input: #f7f6f3;
  --cream: #F1EBE1;
  --paper: #FBF8F3;
  --ink: #22120A;
  --ink-2: #6B5A50;
  --line: #E3D9CC;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  overflow-x: hidden;
  color: var(--text);
}
button { font-family: 'Outfit', sans-serif; cursor: pointer; }
input, textarea { font-family: 'Outfit', sans-serif; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes cardReveal { 0% { transform: scale(0.7) rotateY(90deg); opacity: 0; } 60% { transform: scale(1.02) rotateY(0); opacity: 1; } 100% { transform: scale(1) rotateY(0); opacity: 1; } }
@keyframes cA { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(-170px) translateX(-35px) rotate(500deg); opacity: 0; } }
@keyframes cB { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(-190px) translateX(45px) rotate(-450deg); opacity: 0; } }
@keyframes cC { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(-155px) translateX(-60px) rotate(380deg); opacity: 0; } }

.card-flip-container { perspective: 1200px; }
.card-flipper { position: relative; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1); }
.card-flipper.flipped { transform: rotateY(180deg); }
.card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.card-face-back { transform: rotateY(180deg); }

#tabContentArea { overflow-y: auto !important; scrollbar-width: none; -ms-overflow-style: none; }

::-webkit-scrollbar { width: 0px; height: 0px; }

.mk-bar-short { display: none; }

.mk-nav { position: sticky; top: 0; z-index: 50; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 48px; background: rgba(241,235,225,0.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.mk-logo { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; background: none; border: none; color: var(--ink); cursor: pointer; font-family: inherit; justify-self: start; }

.mk-hero { position: relative; text-align: center; padding: 72px 24px 120px; max-width: 1440px; margin: 0 auto; }

.mk-h1 em { font-style: normal; color: var(--tomato); }
.mk-sub { font-size: clamp(17px, 1.5vw, 20px); line-height: 1.5; color: var(--ink-2); max-width: 30em; margin: 28px auto 0; position: relative; z-index: 2; }
.mk-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 36px; position: relative; z-index: 2; }
.mk-float { position: absolute; z-index: 1; transition: transform .35s cubic-bezier(.2,.7,.2,1); cursor: pointer; }

.mk-fan { display: none; }

.mk-sec { padding: 120px 48px; }
.mk-sec-white { background: #fff; }
.mk-head { text-align: center; max-width: 900px; margin: 0 auto 64px; }
.mk-h2 { font-weight: 500; font-size: clamp(44px, 6.6vw, 96px); line-height: 0.98; letter-spacing: -0.045em; margin: 14px 0 0; }

.mk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1280px; margin: 0 auto; }
.mk-tile { position: relative; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; cursor: pointer; border: none; padding: 0; text-align: left; font-family: inherit; color: var(--ink); }
.mk-tile:focus-visible { outline: 2px solid var(--tomato); outline-offset: 3px; }
.mk-tile-t { position: absolute; top: 22px; left: 24px; font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -0.03em; z-index: 2; }
.mk-tile-b { position: absolute; bottom: 22px; left: 24px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; }
.mk-tile-card { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%) rotate(var(--r, -4deg)); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.mk-tile:hover .mk-tile-card { transform: translate(-50%, -54%) rotate(0deg) scale(1.03); }

.mk-tomato { background: var(--tomato); color: var(--ink); }
.mk-tomato .mk-h2, .mk-tomato .mk-eyebrow { color: #FFF4EE; }
.mk-tomato .mk-h2 { max-width: 7.5em; margin-left: auto; margin-right: auto; }
.mk-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; max-width: 1280px; margin: 0 auto; }
.mk-step { display: flex; flex-direction: column; }
.mk-step-n { font-family: 'DM Mono', monospace; font-size: clamp(64px, 7vw, 104px); line-height: 1; color: #FFF4EE; letter-spacing: -0.04em; }
.mk-step-vis { height: 300px; display: flex; align-items: center; justify-content: center; margin: 24px 0 28px; }

.mk-sendlist { background: var(--paper); border-radius: 16px; padding: 18px; width: 250px; box-shadow: 0 18px 40px rgba(34,18,10,0.18); transform: rotate(3deg); display: flex; flex-direction: column; gap: 8px; }
.mk-sendlist div { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--cream); font-size: 15px; font-weight: 500; }
.mk-sendlist div:first-child { background: var(--ink); color: var(--paper); }

.mk-dark { background: var(--espresso); color: #F1EBE1; }
.mk-split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; max-width: 1180px; margin: 0 auto; }

.mk-dark .mk-lede { color: rgba(241,235,225,0.72); max-width: 26em; }
.mk-photo-stage { position: relative; height: 520px; }
.mk-photo-stage > div { position: absolute; }

.mk-facts { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 1280px; margin: 0 auto; border-top: 1px solid var(--line); }
.mk-fact { padding: 32px 28px 8px 0; }
.mk-fact + .mk-fact { padding-left: 28px; border-left: 1px solid var(--line); }
.mk-fact .mk-eyebrow { color: var(--ink-2); }

.mk-final { background: var(--ink); color: #F1EBE1; text-align: center; padding: 140px 24px; }

@media (max-width: 1100px) {

/* ═══ Card studio ═══ */
body.st-lock { overflow: hidden; }
.st { position: fixed; inset: 0; display: grid; grid-template-rows: 60px 1fr; background: var(--cream); color: var(--ink); font-family: 'Instrument Sans', sans-serif; }
.st button { font-family: inherit; }
.st-top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 0 16px; background: var(--espresso); color: #F1EBE1; }
.st-top-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: inherit; font-size: 15px; padding: 8px 10px; border-radius: 999px; cursor: pointer; justify-self: start; }
.st-top-btn:hover { background: rgba(241,235,225,0.1); }
.st-top-r { justify-self: end; display: flex; align-items: center; gap: 8px; }
.st-steps { display: flex; gap: 4px; background: rgba(241,235,225,0.08); border-radius: 999px; padding: 4px; }
.st-step { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: rgba(241,235,225,0.7); font-size: 14px; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.st-step-n { font-family: 'DM Mono', monospace; font-size: 11px; opacity: .7; }
.st-step.on { background: #F1EBE1; color: var(--ink); }
.st-step:focus-visible, .st-top-btn:focus-visible, .st-tool:focus-visible, .st-switch button:focus-visible { outline: 2px solid var(--tomato); outline-offset: 2px; }

.st-body { display: grid; grid-template-columns: 84px 0 1fr; min-height: 0; }
.st-body.panel-open { grid-template-columns: 84px 340px 1fr; }
.st-rail { background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 12px 8px; overflow-y: auto; }
.st-tool { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; background: none; border: none; border-radius: 14px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.st-tool-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--cream); color: var(--ink); transition: background-color .15s ease; }
.st-tool:hover .st-tool-ic { background: #E8DDCC; }
.st-tool.on { color: var(--ink); font-weight: 600; }
.st-tool.on .st-tool-ic { background: var(--ink); color: var(--paper); }
.st-panel { background: var(--paper); border-right: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.st-panel-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; }
.st-panel-h h2 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin: 0; }
.st-x { background: none; border: none; color: var(--ink-2); padding: 6px; border-radius: 999px; cursor: pointer; display: flex; }
.st-x:hover { background: var(--cream); }
.st-panel-b { padding: 4px 20px 32px; overflow-y: auto; flex: 1; }
.st-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin: 20px 0 8px; }
.st-note { font-size: 14px; color: var(--ink-2); line-height: 1.5; margin: 12px 0; }
.st-input { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 13px; font: inherit; font-size: 15px; color: var(--ink); resize: vertical; }
.st-input:focus { outline: none; border-color: var(--ink) !important; box-shadow: 0 0 0 3px rgba(34,18,10,0.08) !important; }
.st-count.full { color: #C83E20; font-weight: 500; }

.st-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }

function cgStar5(cx, cy, r, rot) {
  var d = "", a0 = (rot || 0) * Math.PI / 180;
  for (var i = 0; i < 10; i++) {
    var rr = i % 2 ? r * 0.46 : r, a = a0 - Math.PI / 2 + i * Math.PI / 5;
    d += (i ? " L" : "M") + (cx + Math.cos(a) * rr).toFixed(1) + "," + (cy + Math.sin(a) * rr).toFixed(1);
  }
  return '<path d="' + d + ' Z"/>';
}
function cgSpark(x, y, s, c) {
  return riso(star4(x, y, s, "none").replace(' fill="none"', ''), c, 2, 2);
}
function cgFace(cx, cy, w) {
  var k = ART_INK;
  return '<g fill="none" stroke="' + k + '" stroke-width="2.6" stroke-linecap="round"><path d="M' + (cx - w - 5) + ',' + cy + ' Q' + (cx - w) + ',' + (cy - 6) + ' ' + (cx - w + 5) + ',' + cy + '"/><path d="M' + (cx + w - 5) + ',' + cy + ' Q' + (cx + w) + ',' + (cy - 6) + ' ' + (cx + w + 5) + ',' + cy + '"/><path d="M' + (cx - 7) + ',' + (cy + 9) + ' Q' + cx + ',' + (cy + 16) + ' ' + (cx + 7) + ',' + (cy + 9) + '"/></g>' +
    '<circle cx="' + (cx - w - 4) + '" cy="' + (cy + 11) + '" r="4.5" fill="#F49AB0"/><circle cx="' + (cx + w + 4) + '" cy="' + (cy + 11) + '" r="4.5" fill="#F49AB0"/>';
}

function encodeCard(data) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }
  catch (e) { return ""; }
}

function decodeCard(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
  catch (e) { return null; }
}

function getSharedCard() {
  try {
    var params = new URLSearchParams(window.location.search);
    var cardParam = params.get("card");
    return cardParam ? decodeCard(cardParam) : null;
  } catch (e) { return null; }
}

function getBgStyle(bg) {
  if (bg.type === "solid") return "background-color:" + bg.value;
  if (bg.type === "texture") {
    var style = "background-image:" + bg.value + ";background-color:" + (bg.bgColor || "#fff");
    if (bg.bgSize) style += ";background-size:" + bg.bgSize;
    return style;
  }
  return "background-image:" + bg.value;
}

function isBgLight(bg) {
  var hex = (bg.type === "solid" ? bg.value : bg.bgColor || "").replace("#", "");
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) return false;
  var r = parseInt(hex.substring(0, 2), 16);
  var g = parseInt(hex.substring(2, 4), 16);
  var b = parseInt(hex.substring(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55;
}

// WCAG contrast ratio checker
function hexToLuminance(hex) {
  hex = hex.replace("#", "");
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) return -1;
  var r = parseInt(hex.substring(0, 2), 16) / 255;
  var g = parseInt(hex.substring(2, 4), 16) / 255;
  var b = parseInt(hex.substring(4, 6), 16) / 255;
  r = r <= 0.03928 ? r / 12.92 : Math.pow((r + 0.055) / 1.055, 2.4);
  g = g <= 0.03928 ? g / 12.92 : Math.pow((g + 0.055) / 1.055, 2.4);
  b = b <= 0.03928 ? b / 12.92 : Math.pow((b + 0.055) / 1.055, 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function getContrastRatio(hex1, hex2) {
  var l1 = hexToLuminance(hex1);
  var l2 = hexToLuminance(hex2);
  if (l1 < 0 || l2 < 0) return -1;
  var lighter = Math.max(l1, l2);
  var darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
}

function checkContrast(textColor, background) {
  var bgHex = background.type === "solid" ? background.value : (background.bgColor || "");
  if (!bgHex || background.type === "gradient") return null;
  var ratio = getContrastRatio(textColor.color, bgHex);
  if (ratio < 0) return null;
  if (ratio < 2) return "This text will be very hard to read on this background. Try a different text color or background.";
  if (ratio < 3) return "This text may be difficult to read. Consider choosing a color with more contrast.";
  return null;
}

// DOM helper: create element with props and children
function h(tag, props, kids) {
  var element = document.createElement(tag);
  if (props) {
    for (var key in props) {
      if (key === "style" && typeof props[key] === "string") {
        element.style.cssText = props[key];
      } else if (key === "style" && typeof props[key] === "object") {
        for (var sk in props[key]) element.style[sk] = props[key][sk];
      } else if (key.indexOf("on") === 0) {
        element.addEventListener(key.slice(2).toLowerCase(), props[key]);
      } else if (key === "className") {
        element.className = props[key];
      } else if (key === "html") {
        element.innerHTML = props[key];
      } else {
        element.setAttribute(key, props[key]);
      }
    }
  }
  if (kids != null) {
    if (!Array.isArray(kids)) kids = [kids];
    for (var i = 0; i < kids.length; i++) {
      var child = kids[i];
      if (child != null) {
        if (typeof child === "string" || typeof child === "number") {
          element.appendChild(document.createTextNode(child));
        } else {
          element.appendChild(child);
        }
      }
    }
  }
  return element;
}

  return {

}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isInStandaloneMode() {
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}
function shouldShowInstallBanner() {
  if (!isIOS()) return false;
  if (isInStandaloneMode()) return false;
  try {
    var dismissed = localStorage.getItem('sc-install-dismissed');
    if (dismissed) {
      var daysSince = (Date.now() - parseInt(dismissed)) / (1000 * 60 * 60 * 24);
      if (daysSince < 30) return false;
    }
  } catch(e) {}
  return true;
}
function renderInstallBanner(parent) {

  text.appendChild(h("p", { style: "font-size:11px;color:var(--text3);margin:2px 0 0" }, "Tap Share then \"Add to Home Screen\""));

}

  var cs = getComputedStyle(inner);
  var availH = inner.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  var first = kids[0], last = kids[kids.length - 1];
  var used = last.offsetTop + last.offsetHeight - first.offsetTop;
  var availW = inner.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  var wide = false;
  for (var i = 0; i < kids.length; i++) if (kids[i].scrollWidth > availW + 1) wide = true;
  return used > availH - (slack || 0) + 0.5 || wide;
}
// Measures the inside off screen; false when the message spills past the margins.
function messageFits() {
  var holder = h("div", { style: "position:fixed;left:-10000px;top:0;visibility:hidden" });
  document.body.appendChild(holder);
  var c = renderCardSide("back", 1, false);
  holder.appendChild(c);
  var p = c.querySelector('[data-edit="message"]');
  var ok = true;
  if (p) {
    if (state.backAutoFit !== false) fitMessage(p.parentNode, p, MIN_MSG_PX, 10);
    else p.style.fontSize = p.dataset.base + "px";
    ok = !messageOverflows(p.parentNode, 10);
  }
  holder.remove();
  return ok;
}
// Shrink the inside message until the whole thing fits on the card.
function fitMessage(inner, p, minPx, slack) {
  if (!inner || !p || !inner.isConnected) return;
  var max = parseFloat(p.dataset.base) || parseFloat(p.style.fontSize);
  function fits(size) { p.style.fontSize = size + "px"; return !messageOverflows(inner, slack); }
  if (fits(max)) return;
  // Largest size that still fits, found by halving the range.
  var lo = minPx, hi = max;
  for (var i = 0; i < 10; i++) {
    var mid = (lo + hi) / 2;
    if (fits(mid)) lo = mid; else hi = mid;
  }
  p.style.fontSize = lo + "px";
}

// Render a flip card container showing both sides
function renderFlipCard(size, showSide, interactive) {
  var scaleMap = { small: 0.48, preview: 0.82, mobile: Math.min((window.innerWidth - 40) / 360, 0.85), previewMobile: Math.min((window.innerWidth - 40) / 360, (window.innerHeight - 180) / 480, 0.82), reveal: 0.88, normal: 1.15 };
  var scale = scaleMap[size] || 1;
  var cardWidth = 360 * scale;
  var cardHeight = 480 * scale;

  var container = h("div", { className: "card-flip-container", style: "width:" + cardWidth + "px;height:" + cardHeight + "px;flex-shrink:0" });
  var flipper = h("div", { className: "card-flipper" + (showSide === "back" ? " flipped" : ""), style: "width:" + cardWidth + "px;height:" + cardHeight + "px" });

  var front = h("div", { className: "card-face" });
  front.appendChild(renderCardSide("front", size, interactive));
  flipper.appendChild(front);

  var back = h("div", { className: "card-face card-face-back" });
  back.appendChild(renderCardSide("back", size, interactive));
  flipper.appendChild(back);

  container.appendChild(flipper);

  if (!interactive) {

// ── STICKER DRAG SYSTEM ──

var dragState = { active: false, id: null, offsetX: 0, offsetY: 0 };
var activeStickerDelete = null;

function startDrag(id, clientX, clientY) {
  var cardEl = document.getElementById("cardZone");
  if (!cardEl) return;
  var rect = cardEl.getBoundingClientRect();
  var stickers = getCurrentStickers();
  var sticker = stickers.find(function(s) { return s.id === id; });
  if (!sticker) return;
  dragState = {
    active: true,
    id: id,
    offsetX: clientX - rect.left - (sticker.x / 100) * rect.width,
    offsetY: clientY - rect.top - (sticker.y / 100) * rect.height
  };
}

function handleDragMove(clientX, clientY) {
  if (!dragState.active) return;
  var cardEl = document.getElementById("cardZone");
  if (!cardEl) return;
  var rect = cardEl.getBoundingClientRect();
  var newX = Math.max(0, Math.min(92, ((clientX - rect.left - dragState.offsetX) / rect.width) * 100));
  var newY = Math.max(0, Math.min(92, ((clientY - rect.top - dragState.offsetY) / rect.height) * 100));
  var stickers = getCurrentStickers();
  for (var i = 0; i < stickers.length; i++) {
    if (stickers[i].id === dragState.id) {
      stickers[i].x = newX;
      stickers[i].y = newY;
    }
  }
  render();
}

document.addEventListener("mousemove", function(e) { handleDragMove(e.clientX, e.clientY); });
document.addEventListener("mouseup", function() { dragState.active = false; });
document.addEventListener("touchmove", function(e) {
  if (dragState.active) { e.preventDefault(); handleDragMove(e.touches[0].clientX, e.touches[0].clientY); }
}, { passive: false });
document.addEventListener("touchend", function() { dragState.active = false; });

function toggleStickerDelete(id) {
  activeStickerDelete = activeStickerDelete === id ? null : id;
  render();
}

function removeSticker(id) {
  if (state.activeSide === "front") {
    state.frontStickers = state.frontStickers.filter(function(s) { return s.id !== id; });
  } else {
    state.backStickers = state.backStickers.filter(function(s) { return s.id !== id; });
  }
  activeStickerDelete = null;
  render();
}

function addSticker(emoji) {
  var sticker = {
    emoji: emoji,
    id: Date.now() + Math.random(),
    x: 15 + Math.random() * 50,
    y: 15 + Math.random() * 50,
    rotation: -20 + Math.random() * 40,
    scale: 0.9 + Math.random() * 0.4,
    size: 28
  };
  if (state.activeSide === "front") {
    state.frontStickers.push(sticker);
  } else {
    state.backStickers.push(sticker);
  }
  render();
}

// One payload builder for every share link.
function stickersOut(list) {

    return { emoji: s.emoji, x: Math.round(s.x), y: Math.round(s.y), rotation: Math.round(s.rotation), scale: Math.round(s.scale * 100) / 100, size: s.size };
  });
}
function buildPayload() {
  var f = { ds: state.frontDesign ? state.frontDesign.id : null, fs: state.frontFontSize, st: stickersOut(state.frontStickers) };
  if (state.frontDesign && state.frontDesign.art) {
    if (typeof state.frontText === "string") f.tx = state.frontText;
    if (state.frontHeadFont) f.hf = state.frontHeadFont;
    if (state.frontInk) f.ik = state.frontInk;
  } else {
    f.bg = state.frontBg.id; f.ly = state.frontLayout.id; f.fn = state.frontFont.id; f.tc = state.frontTextColor.id; f.tx = state.frontText;
  }
  return {

    e: state.env

}

      opLater(function() {
        // Glide the card from where it left the envelope to exactly where the
        // openable card will sit, then swap it in at that spot.
        var cw = 360 * s, ch = 480 * s;
        var sr = stage.getBoundingClientRect();
        var tx = sr.left + W / 2 - cw / 2, ty = sr.top + Math.max(8, (H - ch) / 2);
        var r = cardEl.getBoundingClientRect();
        var natTop = r.top + r.height * 0.62, natLeft = r.left;
        cardEl.style.transition = fast ? "none" : "transform .75s cubic-bezier(.33,.0,.2,1)";
        cardEl.style.transformOrigin = "0 0";
        cardEl.style.transform = "translate(" + (tx - natLeft) + "px," + (ty - natTop) + "px) scale(" + (cw / r.width) + ")";
        scene.classList.add("drop");
      }, fast ? 0 : 1450);
      opLater(function() { showCard(false, true); }, fast ? 50 : 2250);
    });
  }

  // One flat card: design on the front, message on the back. It flips over to read.
  function showCard(startBack, seamless) {
    stage.innerHTML = "";
    var cw = 360 * s, ch = 480 * s;
    var top = Math.max(8, (H - ch) / 2);
    var riser = h("div", { className: "op-riser" + (startBack || seamless ? "" : " op-rise") });
    var flip = h("div", { className: "op-flip", style: "left:" + (W / 2 - cw / 2) + "px;top:" + top + "px;width:" + cw + "px;height:" + ch + "px", role: "button", tabindex: "0" });
    var inner = h("div", { className: "op-flip-in" });
    var front = h("div", { className: "op-side op-side-front" });
    front.appendChild(renderCardSide("front", s, false));
    var back = h("div", { className: "op-side op-side-back" });
    back.appendChild(renderCardSide("back", s, false));
    inner.appendChild(front);
    inner.appendChild(back);
    flip.appendChild(inner);
    riser.appendChild(flip);
    stage.appendChild(riser);

    function setSide(showBack, animate) {
      flip.classList.toggle("no-anim", !animate);
      if (animate) { flip.classList.remove("lift"); void flip.offsetWidth; flip.classList.add("lift"); }
      flip.classList.toggle("flipped", showBack);
      state.opPhase = showBack ? "inside" : "card";
      flip.setAttribute("aria-label", showBack ? "Flip to the front" : "Flip to read the message");
      var flipBtn = h("button", { className: "mk-pill " + (showBack ? "mk-pill-paper mk-pill-sm" : "mk-pill-ink"), onClick: function() { setSide(!flip.classList.contains("flipped"), true); } });
      flipBtn.appendChild(icon("rotate", 16));
      flipBtn.appendChild(h("span", null, showBack ? "See the front" : "Flip to read"));
      if (!showBack) { setFoot([flipBtn]); return; }
      var replay = h("button", { className: "mk-pill mk-pill-paper mk-pill-sm", onClick: showArrive }, "Replay");
      var last;
      if (isPreview) {
        last = h("button", { className: "mk-pill mk-pill-tomato mk-pill-sm", onClick: function() { go("#/send"); } }, "Send it");
        last.appendChild(icon("send", 15));
      } else {
        last = h("button", { className: "mk-pill mk-pill-tomato mk-pill-sm", onClick: makeOneBack }, "Make one back");
        last.appendChild(icon("arrowRight", 15));
      }
      setFoot([flipBtn, replay, last]);
    }
    function toggle() { setSide(!flip.classList.contains("flipped"), true); }
    flip.addEventListener("click", toggle);
    flip.addEventListener("keydown", function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    setSide(!!startBack, false);
    requestAnimationFrame(function() { requestAnimationFrame(function() { flip.classList.remove("no-anim"); }); });
  }
  function showInside() { showCard(true); }

  function makeOneBack() {
    var occ = state.frontDesign && state.frontDesign.occasion;
    var d = ART_DESIGNS.find(function(x) { return x.occasion === occ; }) || ART_DESIGNS[0];
    var to = state.senderName;
    var url = BASE_URL.split("?")[0] + "#/studio/card";
    try { sessionStorage.setItem("sendr-reply", JSON.stringify({ ds: d.id, to: to })); } catch (e) {}
    location.href = url;
  }

  if (state.opPhase === "inside") showInside();
  else if (state.opPhase === "card") showCard();
  else showArrive();
}

    var b = h("button", { className: "sd-opt" + (primary ? " primary" : ""), onClick: onClick });

  }

      navigator.share({ title: fromName() + " sent you a card", text: fromName() + " sent you a card", url: shareUrlNow() }).catch(function() {});

  opts.appendChild(opt("mail", "Email", "Opens your email app", function() {

    else manual();
  });
  opts.appendChild(copyBtn);
  col.appendChild(opts);
  var linkBox = h("input", { className: "st-input sd-link", id: "sdLink", readonly: "readonly", "aria-label": "Card link" });
  linkBox.value = shareUrlNow();
  linkBox.addEventListener("focus", function() { linkBox.select(); });

    go("#/studio/card");
  } }, "Start a new card");
  col.appendChild(fresh);
  body.appendChild(col);
  root.appendChild(body);
  app.appendChild(root);
}

        st.y = Math.max(0, Math.min(92, ((ev.clientY - r.top) / r.height) * 100 - 4));
        el.style.left = st.x + "%";
        el.style.top = st.y + "%";
      }
      function up() {
        el.removeEventListener("pointermove", move);
        el.removeEventListener("pointerup", up);
        if (!moved) {
          var i = list.indexOf(st);
          if (i > -1) list.splice(i, 1);
          refreshStage();
          return;
        }
        saveDraft();
      }
      el.addEventListener("pointermove", move);
      el.addEventListener("pointerup", up);
    });
    el.title = "Drag to move, tap to remove";
  });
}

// Stop state: shown when typing is refused because the card is full.
function showCardFull(full, bump, text) {
  state.msgFull = !!full;
  if (full && text) state.msgFullText = text;
  if (!full) state.msgFullText = null;
  text = state.msgFullText;
  updateCount();
  var b = document.getElementById("stFull");
  if (b) {
    if (full) b.removeAttribute("hidden"); else b.setAttribute("hidden", "hidden");
    var span = b.querySelector("span:last-child");
    if (span) span.textContent = text || "Your card is full. Delete some words to add more.";
  }
  var c = document.querySelector('.st-obj.center [data-edit="message"]');
  var card = c && c.parentNode && c.parentNode.parentNode;
  if (card) {
    card.classList.toggle("st-card-full", !!full);
    if (full && bump) {
      card.classList.remove("st-bump");
      void card.offsetWidth;
      card.classList.add("st-bump");

  }
}

function resizePhoto(file, max, q, done) {
  var reader = new FileReader();
  reader.onload = function() {
    var img = new Image();
    img.onload = function() {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL("image/jpeg", q));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

    var list = ART_DESIGNS.filter(function(d) { return (!occ || d.occasion === occ.id) && matchesQuery(d, query); });
    if (!list.length) {
      results.appendChild(h("p", { className: "br-empty" }, "No cards match that yet. Try birthday, love or thanks."));
      return;
    }
    if (occ || query) {
      var grid = h("div", { className: "br-grid" });
      list.forEach(function(d) { grid.appendChild(card(d)); });
      results.appendChild(grid);
      return;
    }
    OCCASIONS.forEach(function(o) {
      var row = list.filter(function(d) { return d.occasion === o.id; });
      if (!row.length) return;
      var sec = h("section", { className: "br-row" });
      var rh = h("div", { className: "br-row-h" });
      rh.appendChild(h("h2", null, o.label + " cards"));
      var ctl = h("div", { className: "br-row-ctl" });
      var all = h("button", { className: "br-all", onClick: function() { go("#/cards/" + o.id); } }, "View all");
      ctl.appendChild(all);
      var track = h("div", { className: "br-track" });
      var prev = h("button", { className: "br-arrow", "aria-label": "Scroll left", onClick: function() { track.scrollBy({ left: -track.clientWidth * 0.8, behavior: "smooth" }); } });
      prev.appendChild(icon("chevronLeft", 18));
      var next = h("button", { className: "br-arrow", "aria-label": "Scroll right", onClick: function() { track.scrollBy({ left: track.clientWidth * 0.8, behavior: "smooth" }); } });
      next.appendChild(icon("chevronRight", 18));
      ctl.appendChild(prev);
      ctl.appendChild(next);
      rh.appendChild(ctl);
      sec.appendChild(rh);
      row.forEach(function(d) { track.appendChild(card(d)); });
      sec.appendChild(track);
      results.appendChild(sec);
    });
  }
  q.addEventListener("input", function() { state.browseQuery = q.value; draw(); });
  draw();
  app.appendChild(root);
}

function renderCardDetail(app, id) {
  var d = findDesign(id);
  if (!d || !d.art) { go("#/cards"); return; }
  renderBrowse(app, state.detailFrom || null);
  var siblings = ART_DESIGNS.filter(function(x) { return x.occasion === d.occasion; });
  var i = siblings.indexOf(d);
  var env = sanitizeEnv(OCCASION_DEFAULTS[d.occasion]);
  var overlay = h("div", { className: "dt", role: "dialog", "aria-modal": "true", "aria-label": d.label });
  function close() { go(state.detailFrom ? "#/cards/" + state.detailFrom : "#/cards"); }
  overlay.addEventListener("click", function(e) { if (e.target === overlay) close(); });
  var box = h("div", { className: "dt-box" });
  var top = h("div", { className: "dt-top", style: backdropCss(env.k) });
  var x = h("button", { className: "dt-btn dt-x", "aria-label": "Close", onClick: close });
  x.appendChild(icon("x", 18));
  top.appendChild(x);
  var pv = h("button", { className: "dt-btn dt-pv", onClick: function() {
    ensureStudio(); state.frontStickers = []; applyDesign(d); go("#/preview");
  } });
  pv.appendChild(icon("eye", 16));
  pv.appendChild(h("span", null, "Preview"));
  top.appendChild(pv);
  var scene = h("div", { className: "dt-scene" });
  var envEl = envelopeBack(env, 190);
  envEl.className = "dt-env";
  scene.appendChild(envEl);
  var c = artThumb(d, 0.62);
  c.classList.add("dt-card");
  scene.appendChild(c);
  top.appendChild(scene);
  if (siblings.length > 1) {
    var prev = h("button", { className: "dt-btn dt-prev", "aria-label": "Previous card", onClick: function() { go("#/card/" + siblings[(i - 1 + siblings.length) % siblings.length].id); } });
    prev.appendChild(icon("chevronLeft", 20));
    var next = h("button", { className: "dt-btn dt-next", "aria-label": "Next card", onClick: function() { go("#/card/" + siblings[(i + 1) % siblings.length].id); } });
    next.appendChild(icon("chevronRight", 20));
    top.appendChild(prev);
    top.appendChild(next);
  }
  box.appendChild(top);
  var info = h("div", { className: "dt-info" });
  var occ = OCCASIONS.find(function(o) { return o.id === d.occasion; });
  info.appendChild(h("div", { className: "mk-eyebrow", style: "color:var(--ink-2)" }, occ ? occ.label : ""));
  info.appendChild(h("h2", null, d.label));
  if (d.slot) info.appendChild(h("p", { className: "st-note", style: "margin:4px 0 0" }, "Has a frame for your own photo."));
  var start = h("button", { className: "mk-pill mk-pill-ink dt-start", onClick: function() { startDesign(d); } }, "Start with this card");
  start.appendChild(icon("arrowRight", 18));
  info.appendChild(start);
  box.appendChild(info);
  overlay.appendChild(box);
  app.appendChild(overlay);
  document.body.classList.add("st-lock");
  function onKey(e) {
    if (!overlay.isConnected) { document.removeEventListener("keydown", onKey); return; }
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft" && siblings.length > 1) go("#/card/" + siblings[(i - 1 + siblings.length) % siblings.length].id);
    if (e.key === "ArrowRight" && siblings.length > 1) go("#/card/" + siblings[(i + 1) % siblings.length].id);
  }
  document.addEventListener("keydown", onKey);
  requestAnimationFrame(function() { start.focus({ preventScroll: true }); });
}

// Review page listing every illustrated design. Renders each design through
// the real card renderer by swapping the front fields in and out of state.
function renderDesignGallery(app) {
  var keys = ["frontDesign", "frontText", "frontPhoto", "frontHeadFont", "frontInk", "frontFontSize", "frontStickers"];
  var saved = {};
  keys.forEach(function(k) { saved[k] = state[k]; });
  var page = h("div", { style: "min-height:100vh;background:#fff;font-family:'Instrument Sans',sans-serif;color:#22120A" });
  var head = h("div", { style: "background:#F1EBE1;padding:56px 24px 48px;text-align:center" });
  head.appendChild(h("div", { style: "font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#6B5A50" }, "Design review"));
  head.appendChild(h("h1", { style: "font-weight:500;font-size:clamp(48px,8vw,104px);letter-spacing:-0.045em;line-height:1;margin:16px 0 0" }, "Sendr cards"));
  page.appendChild(head);
  var occLabel = {};
  OCCASIONS.forEach(function(oc) { occLabel[oc.id] = oc.label; });
  var sec = h("div", { style: "max-width:1240px;margin:0 auto;padding:48px 24px 8px" });
  var row = h("div", { style: "display:grid;grid-template-columns:repeat(auto-fill,252px);justify-content:center;gap:40px 32px" });
  [ART_DESIGNS.slice(state.reviewFrom || 0)].forEach(function(list) {
    list.forEach(function(d) {
      state.frontDesign = d; state.frontText = null; state.frontPhoto = null; state.frontHeadFont = null; state.frontInk = null; state.frontFontSize = 1; state.frontStickers = [];
      var cell = h("div", { style: "width:252px" });
      cell.appendChild(renderCardSide("front", "thumb", false));
      var cap = h("div", { style: "display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:17px" });
      var capText = h("span", null, d.label);
      cap.appendChild(h("span", { style: "display:flex;flex-direction:column;gap:2px" }, [h("span", { style: "font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#6B5A50" }, occLabel[d.occasion]), capText]));
      cap.appendChild(icon("arrowRight", 16, 1.5));
      cell.appendChild(cap);
      row.appendChild(cell);
    });
  });
  sec.appendChild(row);
  page.appendChild(sec);
  page.appendChild(h("div", { style: "height:64px" }));
  keys.forEach(function(k) { state[k] = saved[k]; });
  app.appendChild(page);
}

// Link preview art (1200x630), rendered once to og-image.png from ?og.

  root.appendChild(h("div", { className: "st-grain", html: '<svg width="100%" height="100%" aria-hidden="true"><rect width="100%" height="100%" fill="#fff" filter="url(#sg-grain)" opacity=".18" style="mix-blend-mode:multiply"/></svg>' }));
  var left = h("div", { style: "position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:560px" });
  var brand = h("div", { style: "display:flex;align-items:center;gap:12px;font-size:30px;font-weight:600;letter-spacing:-0.03em;margin-bottom:40px" });
  var mk = h("i", { style: "width:40px;height:40px;border-radius:50%;background:#E8502F;color:#fff;display:inline-flex;align-items:center;justify-content:center" });
  mk.appendChild(icon("mail", 21, 2.2));
  brand.appendChild(mk);
  brand.appendChild(document.createTextNode("Sendr"));
  left.appendChild(brand);
  var h1 = h("div", { style: "font-size:104px;font-weight:500;letter-spacing:-0.05em;line-height:.94" });
  h1.appendChild(document.createTextNode("You\u2019ve got"));
  h1.appendChild(h("br"));
  h1.appendChild(h("span", { style: "color:#E8502F" }, "a card."));
  left.appendChild(h1);
  left.appendChild(h("div", { style: "font-family:'DM Mono',monospace;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:#6B5A50;margin-top:36px" }, "Tap to open it"));
  root.appendChild(left);
  var env = { c: "cream", l: "confetti", s: "heart", k: "cream" };
  var e1 = envelopeBack(env, 330);
  e1.style.cssText += ";position:absolute;left:640px;top:150px;transform:rotate(-8deg)";
  root.appendChild(e1);
  var keep = { frontDesign: state.frontDesign, frontText: state.frontText, frontPhoto: state.frontPhoto, frontStickers: state.frontStickers, frontHeadFont: state.frontHeadFont, frontInk: state.frontInk, frontFontSize: state.frontFontSize };
  function card(id, x, y, rot, sc) {
    state.frontDesign = findDesign(id); state.frontText = null; state.frontPhoto = null; state.frontStickers = []; state.frontHeadFont = null; state.frontInk = null; state.frontFontSize = 1;
    var c = renderCardSide("front", sc, false);
    var w = h("div", { style: "position:absolute;left:" + x + "px;top:" + y + "px;transform:rotate(" + rot + "deg)" });
    w.appendChild(c);
    root.appendChild(w);
  }
  card("i-ty1", 930, 70, 9, 0.6);
  card("i-bd1", 760, 120, -3, 0.78);
  for (var k in keep) state[k] = keep[k];
  var front = envelopeFront(env, 300, "You");
  front.style.position = "absolute"; front.style.left = "640px"; front.style.top = "392px"; front.style.transform = "rotate(4deg)";
  root.appendChild(front);
  app.appendChild(root);
}

// ── INIT ──
if (/[?&]og(=|&|$)/.test(location.search)) { state.screen = "og"; }
if (/[?&]designs(=|&|$)/.test(location.search)) { state.screen = "designs"; document.title = "Sendr design review"; }
var resizeTimer;
window.addEventListener("resize", function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    if (state.screen === "studio") { refreshStage(); return; }
    render();
  }, 200);
});
// Dev review: ?designs&pack=name loads .pack/name.js and shows only its designs.
var packMatch = /[?&]pack=([a-z0-9_-]+)/.exec(location.search);
if (state.screen === "designs" && packMatch) {
  state.reviewFrom = ART_DESIGNS.length;
  var packScript = document.createElement("script");
  packScript.src = ".pack/" + packMatch[1] + ".js?v=" + Date.now();
  packScript.onload = function() { ALL_DESIGNS = ALL_DESIGNS.concat(ART_DESIGNS.slice(state.reviewFrom)); render(); };
  packScript.onerror = function() { document.title = "PACK LOAD ERROR"; render(); };
  document.body.appendChild(packScript);
} else if (!sharedData && /^#\//.test(location.hash)) applyRoute(); else render();
