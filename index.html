<style>
:root {
  --bg: #f7f6f3;
  --panel: #ffffff;
  --area: #edece8;
  --border: #e2e0db;
  --borderLight: #eeedea;
  --text: #1a1a1a;
  --text2: #666360;
  --text3: #9e9a95;
  --text4: #c8c4be;
  --accent: #1a1a1a;
  --accentLight: #f0efed;
  --input: #f7f6f3;
  --cream: #F1EBE1;
  --paper: #FBF8F3;
  --ink: #22120A;
  --ink-2: #6B5A50;
  --line: #E3D9CC;
  --tomato: #E8502F;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  overflow-x: hidden;
  color: var(--text);
}
button { font-family: 'Outfit', sans-serif; cursor: pointer; }
input, textarea { font-family: 'Outfit', sans-serif; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes cardReveal { 0% { transform: scale(0.7) rotateY(90deg); opacity: 0; } 60% { transform: scale(1.02) rotateY(0); opacity: 1; } 100% { transform: scale(1) rotateY(0); opacity: 1; } }
@keyframes cA { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(-170px) translateX(-35px) rotate(500deg); opacity: 0; } }
@keyframes cB { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(-190px) translateX(45px) rotate(-450deg); opacity: 0; } }
@keyframes cC { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(-155px) translateX(-60px) rotate(380deg); opacity: 0; } }

.card-flip-container { perspective: 1200px; }
.card-flipper { position: relative; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(0.4, 0.0, 0.2, 1); }
.card-flipper.flipped { transform: rotateY(180deg); }
.card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.card-face-back { transform: rotateY(180deg); }

#tabContentArea { overflow-y: auto !important; scrollbar-width: none; -ms-overflow-style: none; }

::-webkit-scrollbar { width: 0px; height: 0px; }

/* ═══ Home page (Givingli-inspired: cream, espresso, one signal color, huge grotesk) ═══ */

.mk-bar { background: var(--espresso); color: #F1EBE1; font-size: 13px; display: flex; justify-content: center; text-align: center; align-items: center; gap: 12px; padding: 9px 48px; }
.mk-bar b { font-family: 'DM Mono', monospace; font-weight: 500; font-size: 10px; letter-spacing: .12em; background: var(--tomato); color: #fff; border-radius: 999px; padding: 3px 8px; margin-right: 10px; }
.mk-bar-short { display: none; }

.mk-nav { position: sticky; top: 0; z-index: 50; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 48px; background: rgba(241,235,225,0.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.mk-logo { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; background: none; border: none; color: var(--ink); cursor: pointer; font-family: inherit; justify-self: start; }
.mk-logo i { width: 28px; height: 28px; border-radius: 50%; background: var(--tomato); color: #fff; display: inline-flex; align-items: center; justify-content: center; }

.mk-nav-cta { justify-self: end; }

.mk-hero { position: relative; text-align: center; padding: 72px 24px 120px; max-width: 1440px; margin: 0 auto; }

.mk-h1 em { font-style: normal; color: var(--tomato); }
.mk-sub { font-size: clamp(17px, 1.5vw, 20px); line-height: 1.5; color: var(--ink-2); max-width: 30em; margin: 28px auto 0; position: relative; z-index: 2; }
.mk-ctas { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 36px; position: relative; z-index: 2; }
.mk-float { position: absolute; z-index: 1; transition: transform .35s cubic-bezier(.2,.7,.2,1); cursor: pointer; }
.mk-float:hover { transform: rotate(0deg) translateY(-6px) !important; }

.mk-fan { display: none; }

.mk-sec { padding: 120px 48px; }
.mk-sec-white { background: #fff; }
.mk-head { text-align: center; max-width: 900px; margin: 0 auto 64px; }
.mk-h2 { font-weight: 500; font-size: clamp(44px, 6.6vw, 96px); line-height: 0.98; letter-spacing: -0.045em; margin: 14px 0 0; }

.mk-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1280px; margin: 0 auto; }
.mk-tile { position: relative; aspect-ratio: 4 / 5; border-radius: 16px; overflow: hidden; cursor: pointer; border: none; padding: 0; text-align: left; font-family: inherit; color: var(--ink); }
.mk-tile:focus-visible { outline: 2px solid var(--tomato); outline-offset: 3px; }
.mk-tile-t { position: absolute; top: 22px; left: 24px; font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -0.03em; z-index: 2; }
.mk-tile-b { position: absolute; bottom: 22px; left: 24px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; }
.mk-tile-card { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%) rotate(var(--r, -4deg)); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.mk-tile:hover .mk-tile-card { transform: translate(-50%, -54%) rotate(0deg) scale(1.03); }

.mk-tomato { background: var(--tomato); color: var(--ink); }
.mk-tomato .mk-h2, .mk-tomato .mk-eyebrow { color: #FFF4EE; }
.mk-tomato .mk-h2 { max-width: 7.5em; margin-left: auto; margin-right: auto; }
.mk-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; max-width: 1280px; margin: 0 auto; }
.mk-step { display: flex; flex-direction: column; }
.mk-step-n { font-family: 'DM Mono', monospace; font-size: clamp(64px, 7vw, 104px); line-height: 1; color: #FFF4EE; letter-spacing: -0.04em; }
.mk-step-vis { height: 300px; display: flex; align-items: center; justify-content: center; margin: 24px 0 28px; }

.mk-sendlist { background: var(--paper); border-radius: 16px; padding: 18px; width: 250px; box-shadow: 0 18px 40px rgba(34,18,10,0.18); transform: rotate(3deg); display: flex; flex-direction: column; gap: 8px; }
.mk-sendlist div { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--cream); font-size: 15px; font-weight: 500; }
.mk-sendlist div:first-child { background: var(--ink); color: var(--paper); }

.mk-dark { background: var(--espresso); color: #F1EBE1; }
.mk-split { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; max-width: 1180px; margin: 0 auto; }

.mk-dark .mk-lede { color: rgba(241,235,225,0.72); max-width: 26em; }
.mk-photo-stage { position: relative; height: 520px; }
.mk-photo-stage > div { position: absolute; }

.mk-facts { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 1280px; margin: 0 auto; border-top: 1px solid var(--line); }
.mk-fact { padding: 32px 28px 8px 0; }
.mk-fact + .mk-fact { padding-left: 28px; border-left: 1px solid var(--line); }
.mk-fact .mk-eyebrow { color: var(--ink-2); }
.mk-fact h3 { font-size: 26px; font-weight: 500; letter-spacing: -0.03em; margin: 40px 0 8px; }

.mk-final { background: var(--ink); color: #F1EBE1; text-align: center; padding: 140px 24px; }

.mk-foot { padding: 56px 48px 40px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; }

@media (max-width: 1100px) {

/* ═══ Card studio ═══ */
body.st-lock { overflow: hidden; }
.st { position: fixed; inset: 0; display: grid; grid-template-rows: 60px 1fr; background: var(--cream); color: var(--ink); font-family: 'Instrument Sans', sans-serif; }
.st button { font-family: inherit; }
.st-top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 0 16px; background: var(--espresso); color: #F1EBE1; }
.st-top-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: inherit; font-size: 15px; padding: 8px 10px; border-radius: 999px; cursor: pointer; justify-self: start; }
.st-top-btn:hover { background: rgba(241,235,225,0.1); }
.st-top-r { justify-self: end; display: flex; align-items: center; gap: 8px; }
.st-steps { display: flex; gap: 4px; background: rgba(241,235,225,0.08); border-radius: 999px; padding: 4px; }
.st-step { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; color: rgba(241,235,225,0.7); font-size: 14px; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.st-step-n { font-family: 'DM Mono', monospace; font-size: 11px; opacity: .7; }
.st-step.on { background: #F1EBE1; color: var(--ink); }
.st-step:focus-visible, .st-top-btn:focus-visible, .st-tool:focus-visible, .st-switch button:focus-visible { outline: 2px solid var(--tomato); outline-offset: 2px; }

.st-body { display: grid; grid-template-columns: 84px 0 1fr; min-height: 0; }
.st-body.panel-open { grid-template-columns: 84px 340px 1fr; }
.st-rail { background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 12px 8px; overflow-y: auto; }
.st-tool { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; background: none; border: none; border-radius: 14px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.st-tool-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--cream); color: var(--ink); transition: background-color .15s ease; }
.st-tool:hover .st-tool-ic { background: #E8DDCC; }
.st-tool.on { color: var(--ink); font-weight: 600; }
.st-tool.on .st-tool-ic { background: var(--ink); color: var(--paper); }
.st-panel { background: var(--paper); border-right: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.st-panel-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 8px; }
.st-panel-h h2 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin: 0; }
.st-x { background: none; border: none; color: var(--ink-2); padding: 6px; border-radius: 999px; cursor: pointer; display: flex; }
.st-x:hover { background: var(--cream); }
.st-panel-b { padding: 4px 20px 32px; overflow-y: auto; flex: 1; }
.st-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin: 20px 0 8px; }
.st-note { font-size: 14px; color: var(--ink-2); line-height: 1.5; margin: 12px 0; }
.st-input { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 13px; font: inherit; font-size: 15px; color: var(--ink); resize: vertical; }
.st-input:focus { outline: none; border-color: var(--ink) !important; box-shadow: 0 0 0 3px rgba(34,18,10,0.08) !important; }
.st-count { text-align: right; font-size: 12px; color: var(--ink-2); margin-top: 6px; font-family: 'DM Mono', monospace; }

.st-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }

function encodeCard(data) {
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }
  catch (e) { return ""; }
}

function decodeCard(str) {
  try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
  catch (e) { return null; }
}

function getSharedCard() {
  try {
    var params = new URLSearchParams(window.location.search);
    var cardParam = params.get("card");
    return cardParam ? decodeCard(cardParam) : null;
  } catch (e) { return null; }
}

function getBgStyle(bg) {
  if (bg.type === "solid") return "background-color:" + bg.value;
  if (bg.type === "texture") {
    var style = "background-image:" + bg.value + ";background-color:" + (bg.bgColor || "#fff");
    if (bg.bgSize) style += ";background-size:" + bg.bgSize;
    return style;
  }
  return "background-image:" + bg.value;
}

function isBgLight(bg) {
  var hex = (bg.type === "solid" ? bg.value : bg.bgColor || "").replace("#", "");
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) return false;
  var r = parseInt(hex.substring(0, 2), 16);
  var g = parseInt(hex.substring(2, 4), 16);
  var b = parseInt(hex.substring(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55;
}

// WCAG contrast ratio checker
function hexToLuminance(hex) {
  hex = hex.replace("#", "");
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) return -1;
  var r = parseInt(hex.substring(0, 2), 16) / 255;
  var g = parseInt(hex.substring(2, 4), 16) / 255;
  var b = parseInt(hex.substring(4, 6), 16) / 255;
  r = r <= 0.03928 ? r / 12.92 : Math.pow((r + 0.055) / 1.055, 2.4);
  g = g <= 0.03928 ? g / 12.92 : Math.pow((g + 0.055) / 1.055, 2.4);
  b = b <= 0.03928 ? b / 12.92 : Math.pow((b + 0.055) / 1.055, 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function getContrastRatio(hex1, hex2) {
  var l1 = hexToLuminance(hex1);
  var l2 = hexToLuminance(hex2);
  if (l1 < 0 || l2 < 0) return -1;
  var lighter = Math.max(l1, l2);
  var darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
}

function checkContrast(textColor, background) {
  var bgHex = background.type === "solid" ? background.value : (background.bgColor || "");
  if (!bgHex || background.type === "gradient") return null;
  var ratio = getContrastRatio(textColor.color, bgHex);
  if (ratio < 0) return null;
  if (ratio < 2) return "This text will be very hard to read on this background. Try a different text color or background.";
  if (ratio < 3) return "This text may be difficult to read. Consider choosing a color with more contrast.";
  return null;
}

// DOM helper: create element with props and children
function h(tag, props, kids) {
  var element = document.createElement(tag);
  if (props) {
    for (var key in props) {
      if (key === "style" && typeof props[key] === "string") {
        element.style.cssText = props[key];
      } else if (key === "style" && typeof props[key] === "object") {
        for (var sk in props[key]) element.style[sk] = props[key][sk];
      } else if (key.indexOf("on") === 0) {
        element.addEventListener(key.slice(2).toLowerCase(), props[key]);
      } else if (key === "className") {
        element.className = props[key];
      } else if (key === "html") {
        element.innerHTML = props[key];
      } else {
        element.setAttribute(key, props[key]);
      }
    }
  }
  if (kids != null) {
    if (!Array.isArray(kids)) kids = [kids];
    for (var i = 0; i < kids.length; i++) {
      var child = kids[i];
      if (child != null) {
        if (typeof child === "string" || typeof child === "number") {
          element.appendChild(document.createTextNode(child));
        } else {
          element.appendChild(child);
        }
      }
    }
  }
  return element;
}

// Handle backward compatibility for old shared card format
function migrateSharedCard(data) {
  if (!data) return null;
  // New format has 'f' (front) property
  if (data.f) return data;
  // Old format has 'oc' (occasion) — migrate to new format
  return {
    f: { bg: data.bg || "g1" },
    b: {
      bg: data.bg || "g1",
      ly: data.ly || "centered",
      fn: data.fn || "playfair",
      tc: data.tc || "white",
      fs: data.fs || 1.0,
      ms: data.ms || "",
      to: data.to || "",
      fr: data.fr || "",
      st: data.st || []
    }
  };
}

// iOS install banner
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isInStandaloneMode() {
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}
function shouldShowInstallBanner() {
  if (!isIOS()) return false;
  if (isInStandaloneMode()) return false;
  try {
    var dismissed = localStorage.getItem('sc-install-dismissed');
    if (dismissed) {
      var daysSince = (Date.now() - parseInt(dismissed)) / (1000 * 60 * 60 * 24);
      if (daysSince < 30) return false;
    }
  } catch(e) {}
  return true;
}
function renderInstallBanner(parent) {
  if (!shouldShowInstallBanner()) return;
  var banner = h("div", { style: "display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0" });
  banner.appendChild(h("img", { src: "icon-192.png", style: "width:36px;height:36px;border-radius:8px;flex-shrink:0" }));
  var text = h("div", { style: "flex:1;min-width:0" });
  text.appendChild(h("p", { style: "font-size:13px;font-weight:600;margin:0" }, "Install Sendr"));
  text.appendChild(h("p", { style: "font-size:11px;color:var(--text3);margin:2px 0 0" }, "Tap Share then \"Add to Home Screen\""));
  banner.appendChild(text);
  banner.appendChild(h("button", {
    style: "background:none;border:none;color:var(--text3);font-size:18px;padding:4px 8px;flex-shrink:0",
    "aria-label": "Dismiss",
    onClick: function() {
      banner.style.display = "none";
      try { localStorage.setItem('sc-install-dismissed', String(Date.now())); } catch(e) {}
    }
  }, "x"));
  parent.appendChild(banner);
}

  render();
}

}

  return state.activeSide === "front" ? state.frontBg : state.backBg;
}
function getCurrentStickers() {
  return state.activeSide === "front" ? state.frontStickers : state.backStickers;
}

// Switch tab without full re-render (mobile + desktop)
function switchTab(tabId) {
  state.tab = tabId;
  var tabContentEl = document.getElementById("tabContentArea");
  var tabRowEl = document.getElementById("tabRowArea");
  if (tabContentEl && tabRowEl) {
    var btns = tabRowEl.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      var tid = btns[i].getAttribute("data-tab");
      var isActive = tid === tabId;
      btns[i].style.borderBottomColor = isActive ? "var(--accent)" : "transparent";
      btns[i].style.color = isActive ? "var(--text)" : "var(--text3)";
    }
    var frag = document.createDocumentFragment();
    var tmp = document.createElement("div");
    renderTabContent(tmp);
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    requestAnimationFrame(function() {
      tabContentEl.innerHTML = "";
      tabContentEl.appendChild(frag);
      tabContentEl.scrollTop = 0;
    });
    return;
  }
  render();
}

// Lightweight card-only refresh (for typing performance)
function refreshCard() {
  var cardZone = document.getElementById("cardZone");
  if (cardZone && cardZone.parentNode) {
    var mobile = isMobile();
    var newCard = renderCardSide(state.activeSide, mobile ? "mobile" : "normal", true);
    cardZone.parentNode.replaceChild(newCard, cardZone);
  }
}

// Update only the card background without replacing the element
function refreshCardBackground() {
  var cardZone = document.getElementById("cardZone");
  if (cardZone) {
    var bg = getCurrentBg();
    var bgStyle = getBgStyle(bg);
    var tempDiv = document.createElement("div");
    tempDiv.style.cssText = bgStyle;
    cardZone.style.background = tempDiv.style.background;
    cardZone.style.backgroundColor = tempDiv.style.backgroundColor;
    cardZone.style.backgroundImage = tempDiv.style.backgroundImage;
    cardZone.style.backgroundSize = tempDiv.style.backgroundSize;

// ── STICKER DRAG SYSTEM ──

var dragState = { active: false, id: null, offsetX: 0, offsetY: 0 };
var activeStickerDelete = null;

function startDrag(id, clientX, clientY) {
  var cardEl = document.getElementById("cardZone");

  var rect = cardEl.getBoundingClientRect();
  var stickers = getCurrentStickers();
  var sticker = stickers.find(function(s) { return s.id === id; });
  if (!sticker) return;
  dragState = {
    active: true,
    id: id,
    offsetX: clientX - rect.left - (sticker.x / 100) * rect.width,
    offsetY: clientY - rect.top - (sticker.y / 100) * rect.height
  };
}

function handleDragMove(clientX, clientY) {
  if (!dragState.active) return;
  var cardEl = document.getElementById("cardZone");
  if (!cardEl) return;
  var rect = cardEl.getBoundingClientRect();
  var newX = Math.max(0, Math.min(92, ((clientX - rect.left - dragState.offsetX) / rect.width) * 100));
  var newY = Math.max(0, Math.min(92, ((clientY - rect.top - dragState.offsetY) / rect.height) * 100));
  var stickers = getCurrentStickers();
  for (var i = 0; i < stickers.length; i++) {
    if (stickers[i].id === dragState.id) {
      stickers[i].x = newX;
      stickers[i].y = newY;
    }
  }
  render();
}

document.addEventListener("mousemove", function(e) { handleDragMove(e.clientX, e.clientY); });
document.addEventListener("mouseup", function() { dragState.active = false; });
document.addEventListener("touchmove", function(e) {
  if (dragState.active) { e.preventDefault(); handleDragMove(e.touches[0].clientX, e.touches[0].clientY); }
}, { passive: false });
document.addEventListener("touchend", function() { dragState.active = false; });

  activeStickerDelete = activeStickerDelete === id ? null : id;

}

  if (state.activeSide === "front") {
    state.frontStickers = state.frontStickers.filter(function(s) { return s.id !== id; });
  } else {
    state.backStickers = state.backStickers.filter(function(s) { return s.id !== id; });

}

      var drawerHandle = h("div", {

      drawerHandle.appendChild(h("span", { style: "font-size:11px;color:var(--text3);margin-top:6px" }, state.drawerOpen ? "Tap to minimize" : "Tap to edit"));
      panel.appendChild(drawerHandle);

      // Tabs row
      var tabsRow = h("div", { id: "tabRowArea", style: "display:flex;border-bottom:1px solid var(--borderLight);flex:0 0 44px;height:44px" });
      for (var ti = 0; ti < tabs.length; ti++) {
        (function(tabItem) {
          var isActive = state.tab === tabItem.id;
          var tabBtn = h("button", {
            "data-tab": tabItem.id,
            style: "flex:1;background:none;border:none;" +

              "font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color 0.15s, border-color 0.15s",

            }
          });
          tabBtn.appendChild(h("span", { style: "font-size:14px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;line-height:1" }, tabItem.icon));

      panel.appendChild(tabsRow);

      var tabContentWrap = h("div", { style: "flex:1;position:relative;overflow:hidden" });
      var tabContent = h("div", { id: "tabContentArea", style: "position:absolute;inset:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:14px 16px 44px;overscroll-behavior:contain" });

      tabContentWrap.appendChild(tabContent);
      tabContentWrap.appendChild(h("div", { style: "position:absolute;bottom:0;left:0;right:0;height:28px;background:linear-gradient(transparent, var(--panel));pointer-events:none;z-index:1" }));

    } else {

      var previewArea = h("div", { style: "flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--area);contain:layout style;overflow:hidden;position:relative" });
      // Toggle row inside preview area on desktop
      function makeToggleBtn(label, side, defaultTab) {
        return h("button", {
          style: "padding:8px 24px;border-radius:20px;font-size:13px;font-weight:600;transition:all 0.2s;" +
            "border:1.5px solid " + (state.activeSide === side ? "var(--accent)" : "var(--border)") + ";" +
            "background:" + (state.activeSide === side ? "var(--accent)" : "transparent") + ";" +
            "color:" + (state.activeSide === side ? "#fff" : "var(--text3)"),
          onClick: function() {
            if (state.activeSide !== side) { state.activeSide = side; state.tab = defaultTab; state.layoutCat = 0; state.bgCat = 0; state.fontCat = 0; render(); }
          }
        }, label);
      }
      var desktopToggle = h("div", { style: "display:flex;justify-content:center;gap:4px;position:absolute;top:12px;left:0;right:0;z-index:5" });
      desktopToggle.appendChild(makeToggleBtn("Front", "front", "designs"));
      desktopToggle.appendChild(makeToggleBtn("Back", "back", "message"));
      previewArea.appendChild(desktopToggle);
      // Tap card to flip (desktop)
      var cardWrap = h("div", { style: "cursor:pointer;position:relative" });
      cardWrap.appendChild(renderCardSide(state.activeSide, "normal", true));
      // Flip hint
      cardWrap.appendChild(h("div", { style: "position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);color:var(--text4);font-size:11px;white-space:nowrap" }, "Click card to flip"));
      cardWrap.addEventListener("click", function(e) {
        if (e.target.dataset && e.target.dataset.sid) return;
        if (e.target.closest && e.target.closest("[data-sid]")) return;
        state.activeSide = state.activeSide === "front" ? "back" : "front";
        state.tab = state.activeSide === "front" ? "designs" : "message";
        state.layoutCat = 0; state.bgCat = 0; state.fontCat = 0;
        render();
      });
      previewArea.appendChild(cardWrap);
      body.appendChild(previewArea);

      var panel = h("div", { style: "width:420px;min-width:420px;max-width:420px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);contain:layout style" });

      var tabsRow = h("div", { id: "tabRowArea", style: "display:flex;border-bottom:1px solid var(--borderLight);flex:0 0 48px;height:48px" });
      for (var ti = 0; ti < tabs.length; ti++) {
        (function(tabItem) {
          var isActive = state.tab === tabItem.id;
          var tabBtn = h("button", {
            "data-tab": tabItem.id,
            style: "flex:1;background:none;border:none;" +
              "border-bottom:2px solid " + (isActive ? "var(--accent)" : "transparent") + ";" +
              "color:" + (isActive ? "var(--text)" : "var(--text3)") + ";" +
              "padding:0;height:48px;" +
              "font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color 0.15s, border-color 0.15s;white-space:nowrap",
            onClick: function() { switchTab(tabItem.id); }
          });
          tabBtn.appendChild(h("span", { style: "font-size:15px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;line-height:1" }, tabItem.icon));
          tabBtn.appendChild(h("span", null, tabItem.label));
          tabsRow.appendChild(tabBtn);
        })(tabs[ti]);
      }
      panel.appendChild(tabsRow);

      var tabContentWrap = h("div", { style: "flex:1;position:relative;overflow:hidden" });
      var tabContent = h("div", { id: "tabContentArea", style: "position:absolute;inset:0;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:20px 20px 40px;overscroll-behavior:contain" });
      renderTabContent(tabContent);
      tabContentWrap.appendChild(tabContent);
      panel.appendChild(tabContentWrap);

      body.appendChild(panel);
      wrapper.appendChild(body);
      app.appendChild(wrapper);
    }

    // Restore focus
    if (focusField) {
      var el = app.querySelector('[data-field="' + focusField + '"]');
      if (el) {
        el.focus();
        if (cursorPosition != null) {
          try { el.setSelectionRange(cursorPosition, cursorPosition); } catch (e) {}
        }
      }
    }
    return;
  }

  // ═══ PREVIEW + RECIPIENT OPENING ═══
  if (state.screen === "preview" || state.screen === "reveal") {
    renderOpening(app, state.screen === "preview");
    return;
  }

  // ═══ SEND ═══
  if (state.screen === "send") {
    renderSend(app);
    return;
  }
}

// One payload builder for every share link.
function stickersOut(list) {
  return (list || []).map(function(s) {
    return { emoji: s.emoji, x: Math.round(s.x), y: Math.round(s.y), rotation: Math.round(s.rotation), scale: Math.round(s.scale * 100) / 100, size: s.size };
  });
}
function buildPayload() {
  var f = { ds: state.frontDesign ? state.frontDesign.id : null, fs: state.frontFontSize, st: stickersOut(state.frontStickers) };
  if (state.frontDesign && state.frontDesign.art) {
    if (typeof state.frontText === "string") f.tx = state.frontText;
    if (state.frontHeadFont) f.hf = state.frontHeadFont;
    if (state.frontInk) f.ik = state.frontInk;
  } else {
    f.bg = state.frontBg.id; f.ly = state.frontLayout.id; f.fn = state.frontFont.id; f.tc = state.frontTextColor.id; f.tx = state.frontText;
  }
  return {
    f: f,
    b: { bg: state.backBg.id, ly: state.backLayout.id, fn: state.backFont.id, tc: state.backTextColor.id, fs: state.backFontSize, ms: state.message, to: state.recipientName, fr: state.senderName, st: stickersOut(state.backStickers) },
    e: state.env
  };
}

// ── Opening: envelope arrives, flap opens, card slides out, card opens like a book ──
var opTimers = [];
function opClear() { opTimers.forEach(clearTimeout); opTimers = []; }
function opLater(fn, ms) { opTimers.push(setTimeout(fn, ms)); }
function prefersReducedMotion() {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
}

function renderOpening(app, isPreview) {
  opClear();
  if (!state.env) state.env = sanitizeEnv(state.envRaw || (state.frontDesign && OCCASION_DEFAULTS[state.frontDesign.occasion]) || null);
  if (!state.opPhase) state.opPhase = "arrive";
  var root = h("div", { className: "op", style: backdropCss(state.env.k) });
  root.appendChild(h("div", { className: "st-grain", html: '<svg width="100%" height="100%" aria-hidden="true"><rect width="100%" height="100%" fill="#fff" filter="url(#sg-grain)" opacity=".16" style="mix-blend-mode:multiply"/></svg>' }));

  var bar = h("div", { className: "op-bar" });
  var brand = h("a", { className: "op-brand", href: isPreview ? "#/studio/envelope" : "./" });
  if (isPreview) {
    brand.appendChild(icon("arrowLeft", 16));
    brand.appendChild(h("span", null, "Back to editing"));
  } else {
    var m = h("i");
    m.appendChild(icon("mail", 13, 2.2));
    brand.appendChild(m);
    brand.appendChild(h("span", null, "Sendr"));
  }
  bar.appendChild(brand);
  if (isPreview) {
    var sendBtn = h("button", { className: "mk-pill mk-pill-tomato mk-pill-sm", onClick: function() { go("#/send"); } }, "Send");
    sendBtn.appendChild(icon("send", 15));
    bar.appendChild(sendBtn);
  }
  root.appendChild(bar);

  var stage = h("div", { className: "op-stage" });
  root.appendChild(stage);
  var foot = h("div", { className: "op-foot" });
  root.appendChild(foot);
  app.appendChild(root);

  var W = stage.clientWidth, H = stage.clientHeight;
  var s = Math.max(0.42, Math.min((H - 24) / 480, (W - 32) / 360, 1.15));
  var envW = Math.min(W - 64, 360 * s * 1.08);
  var from = (state.senderName || "").trim();

  function eyebrow(text) { return h("div", { className: "mk-eyebrow op-eyebrow" }, text); }
  function setFoot(nodes) { foot.innerHTML = ""; nodes.forEach(function(n) { foot.appendChild(n); }); }

  function showArrive() {
    state.opPhase = "arrive";
    stage.innerHTML = "";
    var wrap = h("div", { className: "op-arrive" });
    wrap.appendChild(eyebrow(from ? "A card from " + from : "You got a card"));
    var envBtn = h("button", { className: "op-env", "aria-label": "Open the envelope", onClick: startOpen });
    envBtn.appendChild(envelopeFront(state.env, envW, state.recipientName));
    wrap.appendChild(envBtn);
    stage.appendChild(wrap);
    var open = h("button", { className: "mk-pill mk-pill-ink", onClick: startOpen }, "Open it");
    setFoot([open]);
  }

  // The envelope seen from the back: liner panel, card tucked inside, pocket folds, and the flap.
  function startOpen() {
    state.opPhase = "opening";
    stage.innerHTML = "";
    setFoot([]);
    var col = findIn(ENV_COLORS, state.env.c, "cream"), v = col.v, dd = shadeHex(v, 0.12);
    var bodyH = envW * 0.725, flapH = envW * 0.46;
    var scene = h("div", { className: "op-scene", style: "width:" + envW + "px;height:" + bodyH + "px" });
    scene.appendChild(h("div", { className: "op-layer", html: '<svg viewBox="0 0 400 290" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true"><rect width="400" height="290" rx="6" fill="' + shadeHex(v, 0.06) + '"/><path d="M10,6 L390,6 L200,150 Z" fill="url(#ln-' + state.env.l + ')"/></svg>' }));
    var cardScale = (envW * 0.86) / 360;
    var holder = h("div", { className: "op-holder", style: "left:7%;width:86%;top:5%;bottom:0" });
    var cardEl = renderCardSide("front", cardScale, false);
    cardEl.classList.add("op-card-in");
    holder.appendChild(cardEl);
    scene.appendChild(holder);
    scene.appendChild(h("div", { className: "op-layer op-pocket", html: '<svg viewBox="0 0 400 290" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true"><path d="M0,0 L200,150 L0,290 Z" fill="' + v + '" stroke="' + dd + '" stroke-width="1.5"/><path d="M400,0 L200,150 L400,290 Z" fill="' + v + '" stroke="' + dd + '" stroke-width="1.5"/><path d="M0,290 L200,118 L400,290 Z" fill="' + shadeHex(v, 0.02) + '" stroke="' + dd + '" stroke-width="1.5"/></svg>' }));
    var flap = h("div", { className: "op-flap", style: "height:" + flapH + "px" });
    flap.appendChild(h("div", { className: "op-flap-face", html: '<svg viewBox="0 0 400 184" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true"><path d="M0,0 L400,0 L200,184 Z" fill="' + v + '" stroke="' + dd + '" stroke-width="1.5"/></svg>' }));
    flap.appendChild(h("div", { className: "op-flap-face op-flap-in", html: '<svg viewBox="0 0 400 184" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true"><path d="M0,184 L400,184 L200,0 Z" fill="' + v + '"/><path d="M16,184 L384,184 L200,16 Z" fill="url(#ln-' + state.env.l + ')"/></svg>' }));
    var seal = h("div", { className: "op-seal", html: stampSvg(state.env.s, v, envW * 0.12) });
    flap.appendChild(seal);
    scene.appendChild(flap);
    var sceneWrap = h("div", { className: "op-scene-wrap", style: "padding-top:" + (bodyH * 0.9) + "px" });
    sceneWrap.appendChild(scene);
    stage.appendChild(sceneWrap);

    var fast = prefersReducedMotion();
    requestAnimationFrame(function() {
      scene.classList.add("flap-open");
      opLater(function() { flap.classList.add("behind"); }, fast ? 0 : 380);
      opLater(function() { scene.classList.add("pull"); }, fast ? 0 : 650);
      opLater(function() {
        // Glide the card from where it left the envelope to exactly where the
        // openable card will sit, then swap it in at that spot.
        var cw = 360 * s, ch = 480 * s;
        var sr = stage.getBoundingClientRect();
        var tx = sr.left + W / 2 - cw / 2, ty = sr.top + Math.max(8, (H - ch) / 2);
        var r = cardEl.getBoundingClientRect();
        var natTop = r.top + r.height * 0.62, natLeft = r.left;
        cardEl.style.transition = fast ? "none" : "transform .75s cubic-bezier(.33,.0,.2,1), border-radius .75s ease";
        cardEl.style.transformOrigin = "0 0";
        cardEl.style.transform = "translate(" + (tx - natLeft) + "px," + (ty - natTop) + "px) scale(" + (cw / r.width) + ")";
        cardEl.style.borderTopLeftRadius = "0";
        cardEl.style.borderBottomLeftRadius = "0";
        scene.classList.add("drop");
      }, fast ? 0 : 1450);
      opLater(function() { showCard(false, true); }, fast ? 50 : 2250);
    });
  }

  // A real fold: the inside page sits right of the spine, the cover is hinged on the
  // spine and swings open to the left, showing its blank inside face. The card stays open.
  function showCard(startOpen, seamless) {
    state.opPhase = startOpen ? "inside" : "card";
    stage.innerHTML = "";
    var cw = 360 * s, ch = 480 * s;
    var fits = cw * 2 + 48 <= W;
    var k = fits ? 1 : Math.min(1, (W * 0.8) / cw);
    var spineClosed = W / 2 - cw / 2;
    var spineOpen = fits ? W / 2 : W * 0.16;
    var top = Math.max(8, (H - ch) / 2);
    var book = h("div", { className: "op-spread", style: "width:" + (cw * 2) + "px;height:" + ch + "px;top:" + top + "px;transform-origin:" + cw + "px 50%" });
    function place(open) {
      book.style.transform = open
        ? "translateX(" + (spineOpen - cw) + "px) scale(" + k + ")"
        : "translateX(" + (spineClosed - cw) + "px)";
    }
    var page = h("div", { className: "op-page", style: "left:" + cw + "px" });
    page.appendChild(renderCardSide("back", s, false));
    book.appendChild(page);
    var cover = h("div", { className: "op-cover", style: "left:" + cw + "px;width:" + cw + "px;height:" + ch + "px", role: "button", tabindex: "0", "aria-label": "Open the card" });
    var face = renderCardSide("front", s, false);
    face.classList.add("op-face");
    cover.appendChild(face);
    face.appendChild(h("div", { className: "op-shade op-shade-front" }));
    var backFace = h("div", { className: "op-cover-back", style: "border-radius:" + (20 * s) + "px;" + getBgStyle(state.backBg) });
    backFace.appendChild(h("div", { className: "op-shade op-shade-back" }));
    cover.appendChild(backFace);
    book.appendChild(cover);
    var riser = h("div", { className: "op-riser" + (startOpen || seamless ? "" : " op-rise") });
    riser.appendChild(book);
    stage.appendChild(riser);

    function setOpen(open, animate) {
      book.classList.toggle("no-anim", !animate);
      book.classList.toggle("open", open);
      place(open);
      state.opPhase = open ? "inside" : "card";
      cover.setAttribute("aria-label", open ? "Close the card" : "Open the card");
      if (open) {
        var closeBtn = h("button", { className: "mk-pill mk-pill-paper mk-pill-sm", onClick: function() { setOpen(false, true); } }, "Close card");
        var replay = h("button", { className: "mk-pill mk-pill-paper mk-pill-sm", onClick: showArrive }, "Replay");
        replay.insertBefore(icon("rotate", 15), replay.firstChild);
        var last;
        if (isPreview) {
          last = h("button", { className: "mk-pill mk-pill-tomato mk-pill-sm", onClick: function() { go("#/send"); } }, "Send it");
          last.appendChild(icon("send", 15));
        } else {
          last = h("button", { className: "mk-pill mk-pill-tomato mk-pill-sm", onClick: makeOneBack }, "Make one back");
          last.appendChild(icon("arrowRight", 15));
        }
        setFoot([closeBtn, replay, last]);
      } else {
        setFoot([h("button", { className: "mk-pill mk-pill-ink", onClick: function() { setOpen(true, true); } }, "Open the card")]);
      }
    }
    function toggle() { setOpen(!book.classList.contains("open"), true); }
    cover.addEventListener("click", toggle);
    cover.addEventListener("keydown", function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    setOpen(!!startOpen, false);
    requestAnimationFrame(function() { requestAnimationFrame(function() { book.classList.remove("no-anim"); }); });
  }
  function showInside() { showCard(true); }

  function makeOneBack() {
    var occ = state.frontDesign && state.frontDesign.occasion;
    var d = ART_DESIGNS.find(function(x) { return x.occasion === occ; }) || ART_DESIGNS[0];
    var to = state.senderName;
    var url = BASE_URL.split("?")[0] + "#/studio/card";
    try { sessionStorage.setItem("sendr-reply", JSON.stringify({ ds: d.id, to: to })); } catch (e) {}
    location.href = url;
  }

  if (state.opPhase === "inside") showInside();
  else if (state.opPhase === "card") showCard();
  else showArrive();
}

// ── Send ──
function renderSend(app) {
  function shareUrlNow() { return BASE_URL + "?card=" + encodeCard(buildPayload()); }
  var root = h("div", { className: "sd" });
  var top = h("header", { className: "st-top" });
  var back = h("button", { className: "st-top-btn", onClick: function() { go("#/studio/envelope"); } });
  back.appendChild(icon("arrowLeft", 18));
  back.appendChild(h("span", null, "Edit"));
  top.appendChild(back);
  top.appendChild(h("div", { className: "sd-title" }, "Send"));
  top.appendChild(h("div"));

function refreshStage() {
  var stage = studioEls.stage;

  stage.appendChild(h("div", { className: "st-grain", html: '<svg width="100%" height="100%" aria-hidden="true"><rect width="100%" height="100%" fill="#fff" filter="url(#sg-grain)" opacity=".16" style="mix-blend-mode:multiply"/></svg>' }));

  var side = s * 0.7;

// Edit right on the card: headline (front) and message (inside) become editable.
function wireCardEditing(cardEl, side) {

    t.setAttribute("contenteditable", "plaintext-only");

    t.classList.add("st-editable");

    t.addEventListener("input", function() {

      if (mirror && mirror !== document.activeElement) mirror.value = side === "front" ? state.frontText : state.message;

function resizePhoto(file, max, q, done) {
  var reader = new FileReader();
  reader.onload = function() {
    var img = new Image();
    img.onload = function() {
      var s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL("image/jpeg", q));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

  app.appendChild(root);
}

// ── INIT ──
if (/[?&]og(=|&|$)/.test(location.search)) { state.screen = "og"; }
if (/[?&]designs(=|&|$)/.test(location.search)) { state.screen = "designs"; document.title = "Sendr design review"; }
var resizeTimer;
window.addEventListener("resize", function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    if (state.screen === "studio") { refreshStage(); return; }
    render();
  }, 200);
});
if (!sharedData && /^#\//.test(location.hash)) applyRoute(); else render();

</script>
